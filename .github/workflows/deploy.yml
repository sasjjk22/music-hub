name: Deploy Music Hub Worker

on:
  push:
    branches: [main]
    paths: ["SRC/**", "wrangler.toml", "schema.sql", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply D1 Schema (Idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute music-db --remote --file=./schema.sql
      - name: Deploy Worker & Sync Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          npx --yes wrangler@3 deploy --keep-vars
          if [ -n "$ACCESS_TOKEN" ]; then printf '%s' "$ACCESS_TOKEN" | npx --yes wrangler@3 secret put ACCESS_TOKEN; fi
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@3 secret put ADMIN_PASSWORD; fi
